name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:8.0
        ports: ['27028:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27028
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:web
      - run: node site/scripts/validate-artifact.mjs
      - run: npm audit --omit=dev
      - name: Validate Compose
        env:
          OWNER_KEY: ci-only-owner-key-not-used-outside-tests
          MONGO_PASSWORD: ci-only-database-password
          MONGO_ROOT_PASSWORD: ci-only-root-password
          CLOSER_DOMAIN: closer.example.com
        run: docker compose config --quiet
      - name: Build production container
        run: docker build -t closer:ci .
      - name: Smoke-test production startup and database readiness
        run: |
          docker run -d --name closer-smoke --network host \
            -e PORT=8788 -e HOST=127.0.0.1 \
            -e OWNER_KEY=ci-only-owner-key-not-used-outside-tests \
            -e MONGODB_URI=mongodb://127.0.0.1:27028 \
            -e MONGODB_DATABASE=closer_ci_smoke closer:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8788/readyz; then exit 0; fi
            sleep 1
          done
          docker logs closer-smoke
          exit 1
      - name: Stop smoke-test container
        if: always()
        run: docker rm -f closer-smoke || true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Test usage reducer
        run: |
          mkdir -p artifacts/usage-tests
          javac -d artifacts/usage-tests android/src/app/closer/phone/UsageAccumulator.java tests/UsageAccumulatorTest.java
          java -cp artifacts/usage-tests UsageAccumulatorTest
      - run: npm run build:android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: closer-debug-apk
          path: android/build/closer-debug.apk
          retention-days: 7
